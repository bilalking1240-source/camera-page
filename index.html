<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كاميرا</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    video, canvas, img {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      margin: 10px auto;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #camera {
      display: none;
    }

    #photo {
      display: none;
    }
  </style>
</head>

<body>

  <h1>📷 الكاميرا</h1>

  <p>اضغط تشغيل للسماح باستخدام الكاميرا.</p>

  <button onclick="startCamera()">تشغيل الكاميرا</button>
  <button onclick="takePhoto()">📸 التقاط صورة</button>
  <button onclick="switchCamera()">🔄 تبديل الكاميرا</button>
  <button onclick="stopCamera()">🛑 إيقاف</button>

  <video id="camera" autoplay playsinline></video>

  <canvas id="canvas" style="display:none;"></canvas>

  <img id="photo" alt="الصورة الملتقطة">

  <p id="status"></p>

  <script>
    let stream = null;
    let facingMode = "user";

    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const photo = document.getElementById("photo");
    const status = document.getElementById("status");

    async function startCamera() {
      try {
        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingMode
          },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";
        status.textContent = "الكاميرا تعمل.";

      } catch (error) {
        status.textContent = "تعذر تشغيل الكاميرا: " + error.name;
      }
    }

    function takePhoto() {
      if (!stream) {
        status.textContent = "شغّل الكاميرا أولاً.";
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0);

      photo.src = canvas.toDataURL("image/png");
      photo.style.display = "block";

      status.textContent = "تم التقاط الصورة.";
    }

    async function switchCamera() {
      facingMode = facingMode === "user" ? "environment" : "user";
      await startCamera();
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      video.style.display = "none";
    }
  </script>

</body>
</html>
