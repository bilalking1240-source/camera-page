<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقاط صورة</title>
</head>
<body>

<h2>📸 التقاط صورة</h2>

<button id="cameraBtn">السماح بالكاميرا</button>
<button id="takeBtn" disabled>📸 التقاط الصورة</button>

<canvas id="canvas" style="display:none;"></canvas>

<p id="status"></p>

<script>
const cameraBtn = document.getElementById("cameraBtn");
const takeBtn = document.getElementById("takeBtn");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

let stream;
let video;

cameraBtn.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    // الكاميرا تعمل لكن بدون عرض المعاينة
    video = document.createElement("video");
    video.srcObject = stream;
    video.muted = true;
    await video.play();

    takeBtn.disabled = false;
    status.textContent = "تم السماح بالكاميرا ✅ اضغط التقاط الصورة";
  } catch (error) {
    status.textContent = "لم يتم السماح بالكاميرا ❌";
  }
};

takeBtn.onclick = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  // إيقاف الكاميرا بعد الالتقاط
  stream.getTracks().forEach(track => track.stop());

  status.textContent = "تم التقاط الصورة ✅";
};
</script>

</body>
</html>
