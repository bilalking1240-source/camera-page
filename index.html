<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكاميرا</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    video, canvas {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
    }

    button {
      margin: 15px 5px;
      padding: 14px 25px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h2>📷 الكاميرا</h2>

  <video id="video" autoplay playsinline></video>

  <br>

  <button id="start">تشغيل الكاميرا</button>
  <button id="take" disabled>📸 التقاط صورة</button>

  <canvas id="canvas" style="display:none;"></canvas>

  <h3 id="result"></h3>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const start = document.getElementById("start");
    const take = document.getElementById("take");
    const result = document.getElementById("result");

    let stream;

    start.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true
        });

        video.srcObject = stream;
        take.disabled = false;
        result.textContent = "الكاميرا تعمل ✅";
      } catch (error) {
        result.textContent = "لم يتم السماح باستخدام الكاميرا ❌";
      }
    };

    take.onclick = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      canvas.style.display = "block";

      result.textContent = "تم التقاط الصورة ✅";
    };
  </script>

</body>
</html>
