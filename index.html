<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقاط صورة</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.12);
    }

    video,
    img {
      width: 100%;
      border-radius: 14px;
      background: #111;
      margin-top: 15px;
    }

    button {
      border: none;
      padding: 13px 20px;
      margin: 8px 4px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #start {
      background: #198754;
      color: white;
    }

    #capture {
      background: #0d6efd;
      color: white;
    }

    #save {
      background: #333;
      color: white;
    }

    button:disabled {
      opacity: .45;
    }

    #status {
      color: #555;
      margin: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>📷 التقاط صورة</h2>

    <p>
      اضغط على الزر أدناه لتشغيل الكاميرا.
      سيظهر طلب إذن الكاميرا من المتصفح بشكل واضح.
    </p>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button id="start">
      تشغيل الكاميرا
    </button>
